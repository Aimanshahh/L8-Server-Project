<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Users page — light vs dark</title>
<style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; }
    body {
        display: flex;
        background: #0b0f18;
        font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        color: #E6EDF7;
    }
    .pane {
        flex: 0 0 900px;
        width: 900px;
        min-width: 0;
        display: flex;
        flex-direction: column;
        border-right: 2px solid #3B82F6;
        overflow: hidden;
    }
    .pane:last-child { border-right: 0; }
    .pane__label {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .06em;
        text-transform: uppercase;
        background: #111826;
        border-bottom: 1px solid #263144;
    }
    .pane__label i { font-style: normal; }
    .pane__label--light { color: #FBBF24; }
    .pane__label--dark { color: #7EB0FF; }
    /* each pane is a 900px viewport, the same responsive layout a narrow
       desktop window gets (the table scrolls inside .table-responsive) */
    .pane iframe { flex: 1 1 auto; width: 100%; border: 0; background: #fff; }
</style>
</head>
<body>
<div class="pane">
    <div class="pane__label pane__label--light"><i>&#9728;</i> Light theme (data-theme="light")</div>
    <iframe src="users.html?theme=light" title="light"></iframe>
</div>
<div class="pane">
    <div class="pane__label pane__label--dark"><i>&#9789;</i> Dark theme (data-theme="dark")</div>
    <iframe src="users.html?theme=dark" title="dark"></iframe>
</div>
</body>
</html>
